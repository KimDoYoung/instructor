<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* .search-container {

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .clear-button {
            position: absolute;
            right: 10px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e9ecef;
            border: none;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
        }         
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="search-container mb-3">
            <input type="text" id="searchInput" class="form-control rounded-pill" placeholder="Search...">
            <button id="clearButton" class="clear-button">&times;</button>
        </div>
        <ul id="list" class="list-group">
            <!-- List items will be inserted here -->
        </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
$(document).ready(function() {
    const items = ["라디메딕", "한중", "LG리트리머스", "Grapes", "Strawberry", "Pineapple"];
    
    function displayItems(filteredItems) {
        $('#list').empty();
        filteredItems.forEach(item => {
            $('#list').append(`<li class="list-group-item">${item}</li>`);
        });
    }

    $('#searchInput').on('input', function() {
        const query = $(this).val().toLowerCase();
        const filteredItems = items.filter(item => item.toLowerCase().includes(query));
        displayItems(filteredItems);
    });
    // DEL 키를 캡처하여 입력 필드 내용 삭제
    $('#searchInput').on('keydown', function(e) {
        if (e.keyCode === 46) {  // DEL 키
            $(this).val('');
            displayItems(items);
        }
    });

    $('#clearButton').on('click', function() {
        $('#searchInput').val('');
        displayItems(items);
    });

    // 초기 리스트 표시
    displayItems(items);
});

    </script>
</body>
</html>
